[package]
name = "agent-tally"
version = "0.5.0"
description = "A live activity and usage dashboard for local AI coding agents"
edition = "2021"

[lib]
name = "agent_tally_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
rusqlite = { version = "0.40.2", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
