<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>AgentTally · Compact status</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="stylesheet" href="buddy.css">
</head>
<body>
  <header class="bar" id="drag-region" data-tauri-drag-region>
    <h1><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>AgentTally</h1>
    <span class="source" id="source">Connecting</span>
  </header>
  <main>
    <section class="priority" aria-labelledby="session-title">
      <div class="status-line">
        <strong id="status">Connecting</strong>
        <time id="seen" hidden></time>
      </div>
      <h2 id="session-title">Waiting for the scanner</h2>
      <p class="context" id="context" hidden></p>
      <p class="action" id="action">The first local scan will appear here.</p>
    </section>
    <dl class="counts" aria-label="Session counts">
      <div><dt id="approval-label">approvals</dt><dd id="blocked">–</dd></div>
      <div><dt id="reply-label">replies needed</dt><dd id="waiting">–</dd></div>
      <div><dt>working</dt><dd id="working">–</dd></div>
    </dl>
  </main>
  <footer>
    <span id="scan">No scan yet</span>
    <button id="restore" type="button">Open dashboard</button>
    <button id="move" type="button" hidden aria-label="Move to next screen corner" title="Move to next screen corner">
      <svg aria-hidden="true" focusable="false" viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 3H3v4m10-4h4v4M3 13v4h4m10-4v4h-4m-7-3 8-8M10 6h4v4"/>
      </svg>
    </button>
  </footer>
  <div class="sr-only" role="status" id="announcement"></div>
  <script type="module" src="js/buddy.js"></script>
</body>
</html>
